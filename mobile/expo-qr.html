<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ParkingApp — QR Expo</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --text: #e8eef7;
      --muted: #8b9bb4;
      --accent: #3d8bfd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(ellipse at 30% 20%, #1a2a44, var(--bg) 55%);
      color: var(--text);
      padding: 24px;
    }
    .wrap {
      width: min(420px, 100%);
      text-align: center;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 650;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    p { color: var(--muted); margin: 0 0 20px; font-size: 0.95rem; line-height: 1.45; }
    #qr {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      display: inline-block;
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
    }
    .url {
      margin-top: 18px;
      word-break: break-all;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 0.85rem;
      color: var(--accent);
      background: var(--card);
      padding: 12px 14px;
      border-radius: 10px;
    }
    .hint { margin-top: 14px; font-size: 0.85rem; }
    input, button {
      font: inherit;
      border-radius: 10px;
      border: 1px solid #2a3a52;
      padding: 10px 12px;
    }
    input {
      width: 100%;
      background: var(--card);
      color: var(--text);
      margin-bottom: 10px;
    }
    button {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { filter: brightness(1.08); }
    .row { margin-top: 16px; text-align: left; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>ParkingApp — Expo Go</h1>
    <p>Escaneie no <strong>Expo Go</strong> (mesmo Wi‑Fi do PC).</p>
    <div id="qr"></div>
    <div class="url" id="urlLabel"></div>
    <p class="hint">Se o IP mudar, cole o novo link abaixo e clique em Atualizar.</p>
    <div class="row">
      <input id="urlInput" value="exp://10.1.26.209:8081" />
      <button type="button" id="btn">Atualizar QR</button>
    </div>
  </div>
  <script>
    const input = document.getElementById("urlInput");
    const label = document.getElementById("urlLabel");
    const canvasHost = document.getElementById("qr");

    function render() {
      const url = input.value.trim();
      label.textContent = url;
      canvasHost.innerHTML = "";
      const canvas = document.createElement("canvas");
      canvasHost.appendChild(canvas);
      QRCode.toCanvas(canvas, url, { width: 280, margin: 1 }, (err) => {
        if (err) label.textContent = "Erro ao gerar QR: " + err;
      });
    }

    document.getElementById("btn").addEventListener("click", render);
    render();
  </script>
</body>
</html>
